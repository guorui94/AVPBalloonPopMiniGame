<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>NYP Open House – Leaderboard</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --card: #111827;
      --muted: #93a4b6;
      --text: #e5eef7;
      --accent: #22d3ee;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial; }
    .wrap { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
    .title {
      font-size: 40px; font-weight: 800; letter-spacing: .3px; margin: 0 0 4px;
      background: linear-gradient(90deg, var(--accent), #60a5fa);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle { color: var(--muted); margin: 0 0 24px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab { background: #0f172a; border: 1px solid #1f2a44; color: var(--text);
      padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .tab.active { border-color: var(--accent); box-shadow: 0 0 0 2px #0a1722 inset; }
    .card { background: var(--card); border: 1px solid #1f2a44; border-radius: 16px; overflow: hidden; }
    .header, .row { display: grid; grid-template-columns: 72px 1fr 140px 220px;
      padding: 14px 18px; align-items: center; gap: 12px; }
    .header { color: #cbd5e1; font-weight: 700; border-bottom: 1px solid #1f2a44; background: #0f172a; }
    .row:nth-child(even) { background: #0f172a; }
    .rank { text-align: right; opacity: .9; font-variant-numeric: tabular-nums; }
    .score { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
    .when { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footer { display: flex; justify-content: space-between; color: var(--muted);
      font-size: 12px; padding: 10px 2px; margin-top: 10px; }
    .ok { color: #34d399; } .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">NYP Open House Leaderboard</h1>
    <p class="subtitle">Live high scores from Firestore</p>

    <div class="tabs" id="tabs"></div>

    <div class="card">
      <div class="header">
        <div class="rank">#</div>
        <div>Player</div>
        <div class="score">Score</div>
        <div class="when">When</div>
      </div>
      <div id="rows"></div>
    </div>

    <div class="footer">
      <div>Game: <strong id="activeGame"></strong></div>
      <div id="status">Connecting…</div>
    </div>
  </div>

  <!-- Firebase v9 modular SDKs from CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import {
      getFirestore, collection, query, where, orderBy, limit, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    // Your Firebase Web App config
    const firebaseConfig = {
      apiKey: "AIzaSyDGb2cB7XZe_ggOLahMLXdUOzolSIdvndA",
      authDomain: "nyp-open-house.firebaseapp.com",
      projectId: "nyp-open-house",
      storageBucket: "nyp-open-house.firebasestorage.app",
      messagingSenderId: "401402380709",
      appId: "1:401402380709:web:de63baa06171ff42cee84c",
      measurementId: "G-P0D7ECHCSJ"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Page wiring
    const GAMES = ["Balloon Frenzy", "ARcade of Memories"];
    const tabsEl = document.getElementById("tabs");
    const rowsEl = document.getElementById("rows");
    const activeGameEl = document.getElementById("activeGame");
    const statusEl = document.getElementById("status");

    let unsub = null;
    let selectedGame = (new URLSearchParams(location.search)).get("game") || GAMES[0];

    function fmtDate(ts) {
      if (!ts) return "—";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString(undefined, {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      GAMES.forEach(g => {
        const b = document.createElement("button");
        b.className = "tab" + (g === selectedGame ? " active" : "");
        b.textContent = g;
        b.onclick = () => {
          if (g === selectedGame) return;
          selectedGame = g;
          history.replaceState({}, "", `?game=${encodeURIComponent(g)}`);
          renderTabs();
          watchGame(g);
        };
        tabsEl.appendChild(b);
      });
      activeGameEl.textContent = selectedGame;
    }

    function renderRows(docs) {
      rowsEl.innerHTML = "";
      if (!docs.length) {
        const empty = document.createElement("div");
        empty.className = "row";
        empty.innerHTML = `
          <div class="rank">—</div>
          <div class="name" style="opacity:.7">No scores yet</div>
          <div class="score">—</div>
          <div class="when">—</div>
        `;
        rowsEl.appendChild(empty);
        return;
      }
      docs.forEach((doc, i) => {
        const d = doc.data();
        const r = document.createElement("div");
        r.className = "row";
        r.innerHTML = `
          <div class="rank">${i + 1}</div>
          <div class="name">${(d.name || "Player")
            .toString()
            .replace(/[<>&]/g, s => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))}</div>
          <div class="score">${d.score ?? 0}</div>
          <div class="when">${fmtDate(d.createdAt)}</div>
        `;
        rowsEl.appendChild(r);
      });
    }

    function setStatus(ok, msg) {
      statusEl.innerHTML = ok ? `<span class="ok">●</span> ${msg}` : `<span class="err">●</span> ${msg}`;
    }

    // Live query for selected game
    function watchGame(game) {
      if (unsub) { unsub(); unsub = null; }
      setStatus(true, "Live");

      const qRef = query(
        collection(db, "sessions"),
        where("gameType", "==", game),
        orderBy("score", "desc"),
        limit(50)
      );

      unsub = onSnapshot(qRef, (snap) => {
        renderRows(snap.docs);
      }, (err) => {
        console.error(err);
        setStatus(false, err.message || "Listener error");
      });
    }

    // Start
    renderTabs();

    // Anonymous auth (safe to keep even if reads are public)
    onAuthStateChanged(auth, (u) => {
      if (!u) signInAnonymously(auth).catch(console.error);
    });

    watchGame(selectedGame);
  </script>
</body>
</html>
